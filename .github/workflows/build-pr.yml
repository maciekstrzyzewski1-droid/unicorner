name: Build (pull request)

# Sprawdza, czy strona sie buduje, zanim cokolwiek trafi na main.
# Nic nie publikuje — deploy robi deploy.yml po merge.
# Akcje przypiete do pelnego SHA (komentarz = wersja); aktualizuje je Dependabot (.github/dependabot.yml).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24   # Node 24 LTS; Astro 7 wymaga >= 22.23.4 (package.json -> engines)
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (Astro)
        run: npm run build
      - name: Test tresci (kod zamiast liczby, bledy KaTeX)
        run: node narzedzia/tresc-check/sprawdz.mjs dist
      - name: Kontrola danych kursow jezykowych
        run: node narzedzia/jezyki-check/sprawdz.mjs
      - name: Testy jednostkowe kursu jezykowego
        run: node --test "narzedzia/jezyki-check/*.test.mjs"
      - name: Playwright (do testu sieciowego i dymnego, poza zaleznosciami projektu)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test sieciowy (lista dozwolonych origin)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node narzedzia/siec-check/sprawdz.cjs dist
      - name: Test dymny kursu jezykowego (lekcja otwiera sie, jedno cwiczenie)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node narzedzia/jezyki-check/dymny.cjs dist hiszpanski.html
          node narzedzia/jezyki-check/dymny.cjs dist angielski.html
