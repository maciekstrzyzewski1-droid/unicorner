name: Build (pull request)

# Sprawdza, czy strona sie buduje, zanim cokolwiek trafi na main.
# Nic nie publikuje — deploy robi deploy.yml po merge.
# Akcje przypiete do pelnego SHA (komentarz = wersja); aktualizuje je Dependabot (.github/dependabot.yml).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24   # Astro 7 wymaga Node >= 22.23.4; 24 = aktualne LTS
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (Astro)
        run: npm run build
      - name: Playwright (do testu sieciowego, poza zaleznosciami projektu)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test sieciowy (lista dozwolonych origin)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node narzedzia/siec-check/sprawdz.cjs dist
