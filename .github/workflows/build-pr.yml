name: Build (pull request)

# Sprawdza, czy strona sie buduje, zanim cokolwiek trafi na main.
# Nic nie publikuje — deploy robi deploy.yml po merge.
# Akcje przypiete do pelnego SHA (komentarz = wersja); aktualizuje je Dependabot (.github/dependabot.yml).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (Astro)
        run: npm run build
