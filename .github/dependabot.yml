# Dependabot: aktualizacje wersji raz w tygodniu.
# - github-actions: akcje przypiete do SHA, jeden zbiorczy PR.
# - npm: minor i patch w jednym zbiorczym PR, kazdy major w osobnym PR (do swiadomej decyzji).
# Alerty i poprawki bezpieczenstwa dla npm dzialaja niezaleznie od tego pliku (Settings -> Advanced Security).
# Playwright do testow w CI jest przypiety w .github/workflows/build-pr.yml; Dependabot go nie widzi.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      akcje:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # najwyzej 5 otwartych PR naraz (zbiorczy + pojedyncze majory)
    open-pull-requests-limit: 5
    groups:
      npm-drobne:
        applies-to: version-updates
        patterns: ["*"]
        # three ma wersje 0.x: Dependabot liczy 0.185 -> 0.186 jako minor, choc to zmiana lamiaca API.
        # Dlatego three idzie osobnym PR, poza grupa.
        exclude-patterns: ["three"]
        update-types: ["minor", "patch"]
    # Majory React 19 / R3F 9 / drei 10 wstrzymane do decyzji U1 (b) z ROADMAP.md:
    # usunac nieuzywane od PR #70 komponenty 3D (src/components/*.jsx) razem z zaleznosciami,
    # czy zostawic i podniesc je razem jedna galezia (osobno sie nie instaluja: ERESOLVE, PR #80, #81, #83).
    # Poprawki bezpieczenstwa to nie blokuje: update-types dotyczy tylko aktualizacji wersji.
    # Po decyzji usunac ten blok.
    ignore:
      - dependency-name: "@react-three/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
